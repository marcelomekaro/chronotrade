<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  :root { --ouro:#F2C14E; --creme:#E9E1C8; --texto:#EDE6D2; --suave:#A9B0D6; --tinta:#0A0E26; --verde:#5FD39A; --verm:#F06A5D; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:transparent; font-family:'Atkinson Hyperlegible','Segoe UI',sans-serif;
    color:var(--texto); -webkit-user-select:none; user-select:none; }
  .salao { position:relative; border:3px solid var(--creme); border-radius:8px; overflow:hidden;
    box-shadow: inset 0 0 0 3px #0B1040, 4px 4px 0 #0A0E26; outline:none;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 2px, transparent 2px 36px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.16) 0 2px, transparent 2px 36px),
      linear-gradient(180deg, #3A2F5B 0%, #2B2550 34%, #24305E 100%); }
  .salao:focus-visible { box-shadow: inset 0 0 0 3px var(--ouro), 4px 4px 0 #0A0E26; }
  .letreiro { position:absolute; left:0; right:0; top:0; height:30px; background:#05071A; border-bottom:3px solid var(--creme);
    white-space:nowrap; overflow:hidden; font-family:'Pixelify Sans','Courier New',monospace; font-size:15px; line-height:27px; z-index:5; }
  .letreiro span { display:inline-block; padding-left:100%; animation: rolar 40s linear infinite; }
  .letreiro b { margin:0 18px; font-weight:500; } .s { color:var(--verde); } .d { color:var(--verm); }
  @keyframes rolar { to { transform: translateX(-100%); } }
  .telao { position:absolute; left:50%; top:40px; transform:translateX(-50%); width:min(56%, 520px); height:24%;
    background:#0B1040; border:3px solid var(--creme); border-radius:4px; padding:6px 12px; z-index:4; cursor:pointer;
    box-shadow:0 0 22px rgba(164,139,255,.35); display:flex; gap:12px; align-items:center; }
  .telao .info { flex:0 0 auto; max-width:46%; }
  .telao .t { font-family:'Pixelify Sans','Courier New',monospace; color:var(--ouro); font-size:19px; line-height:1.1; }
  .telao .st { color:var(--suave); font-size:12px; margin-top:3px; }
  .telao svg { flex:1; height:100%; min-width:0; }
  .chao { position:absolute; inset:0; z-index:1; cursor:crosshair; }
  .mesa { position:absolute; width:86px; height:16px; background:#6B4A2B; border:2px solid var(--tinta); border-radius:2px;
    box-shadow:0 4px 0 #3D2A17; transform:translate(-50%,-50%); opacity:.55; pointer-events:none; }
  .mesa::after { content:""; position:absolute; left:30px; top:-18px; width:24px; height:16px; background:#121838; border:2px solid var(--tinta); }
  .planta { position:absolute; font-size:26px; transform:translate(-50%,-100%); opacity:.85; pointer-events:none; }
  .pessoa { position:absolute; transform:translate(-50%,-100%); z-index:10; display:flex; flex-direction:column; align-items:center;
    cursor:pointer; transition:left 1s linear, top 1s linear; }
  .pessoa .corpo { position:relative; display:flex; justify-content:center; }
  .pessoa .sprite { display:block; image-rendering:pixelated; filter: drop-shadow(0 3px 0 rgba(0,0,0,.35)); }
  .pessoa .foto { width:44px; height:44px; border-radius:50%; object-fit:cover; border:2px solid var(--creme);
    box-shadow:0 0 0 2px #0B1040, 0 3px 0 rgba(0,0,0,.4); }
  .pessoa.andando .corpo { animation: passo .32s steps(2) infinite; }
  @keyframes passo { 50% { transform: translateY(-4px); } }
  .pessoa.esquerda .sprite { transform: scaleX(-1); }
  .pessoa .nome { margin-top:3px; font-size:12px; background:rgba(5,7,26,.8); padding:1px 7px; border-radius:3px; white-space:nowrap;
    max-width:120px; overflow:hidden; text-overflow:ellipsis; }
  .pessoa.eu .nome { color:var(--ouro); border:1px solid var(--ouro); }
  .pessoa.eu::before { content:"▼"; position:absolute; top:-16px; color:var(--ouro); font-size:12px; animation: pulo 1s ease-in-out infinite; }
  @keyframes pulo { 50% { transform: translateY(-3px); } }
  .balao[hidden] { display:none !important; }
  .pessoa.borda-esq .balao { left:0; transform:none; } .pessoa.borda-dir .balao { left:auto; right:0; transform:none; }
  .pessoa.borda-dir .monitor { left:auto; right:100%; margin-left:0; margin-right:4px; }
  .balao { position:absolute; bottom:100%; left:50%; transform:translateX(-50%); margin-bottom:8px; width:150px; background:var(--creme); color:#1B1606;
    border:2px solid var(--tinta); border-radius:6px; padding:4px 7px; font-size:11.5px; line-height:1.3; box-shadow:3px 3px 0 var(--tinta);
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; pointer-events:none; }
  .monitor { position:absolute; left:100%; bottom:18px; margin-left:4px; width:84px; height:56px; background:#05071A;
    border:2px solid var(--creme); border-radius:3px; padding:2px 3px; box-shadow:2px 2px 0 var(--tinta); }
  .monitor .mt { font-family:'Pixelify Sans','Courier New',monospace; font-size:10.5px; color:var(--ouro); display:flex; justify-content:space-between; }
  .monitor svg { width:100%; height:38px; display:block; }
  .menu { position:absolute; z-index:500; background:#121838; border:2px solid var(--creme); border-radius:6px; padding:4px; box-shadow:4px 4px 0 var(--tinta);
    min-width:190px; }
  .menu .cab { font-size:12px; color:var(--suave); padding:4px 8px; }
  .menu button { display:block; width:100%; text-align:left; background:none; border:0; color:var(--texto); font:inherit; font-size:14px;
    padding:7px 8px; border-radius:4px; cursor:pointer; }
  .menu button:hover, .menu button:focus-visible { background:#2B3BA0; outline:none; }
  .dica { position:absolute; left:10px; bottom:8px; z-index:6; font-size:12px; color:var(--suave); background:rgba(5,7,26,.7);
    padding:3px 8px; border-radius:4px; pointer-events:none; }
  .alvo { position:absolute; width:18px; height:8px; border:2px solid var(--ouro); border-radius:50%; transform:translate(-50%,-50%);
    z-index:2; pointer-events:none; animation: alvo .7s ease-out forwards; }
  @keyframes alvo { from { opacity:1; transform:translate(-50%,-50%) scale(.6); } to { opacity:0; transform:translate(-50%,-50%) scale(2); } }
  .janela { position:absolute; inset:0; z-index:600; background:rgba(5,7,26,.78); display:flex; align-items:center; justify-content:center; }
  .grafico { width:min(92%, 720px); background:#0B1040; border:3px solid var(--creme); border-radius:8px; padding:14px 16px;
    box-shadow:0 0 0 3px #0B1040, 6px 6px 0 rgba(0,0,0,.5); }
  .grafico .topo { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .grafico .tk { font-family:'Pixelify Sans','Courier New',monospace; color:var(--ouro); font-size:24px; }
  .grafico .meta { color:var(--suave); font-size:13px; }
  .grafico svg { width:100%; height:240px; display:block; margin-top:8px; }
  .grafico .nota { margin-top:6px; font-size:14px; }
  .grafico .fechar { background:none; border:2px solid var(--creme); color:var(--texto); border-radius:4px; padding:2px 10px; cursor:pointer; font:inherit; }
  .grafico .aviso { font-size:11px; color:#7C84B5; margin-top:6px; }
  @media (max-width: 560px) {
    .balao { width:112px; font-size:10.5px; -webkit-line-clamp:2; margin-bottom:4px; }
    .salao.estreito .balao.velho { display:none; }
    .pessoa .sprite { width:36px; height:48px; } .pessoa .foto { width:34px; height:34px; }
    .pessoa .nome { font-size:10.5px; max-width:86px; padding:0 5px; }
    .monitor { width:58px; height:40px; bottom:12px; } .monitor svg { height:24px; } .monitor .mt { font-size:9px; }
    .telao { width:84%; height:19%; padding:4px 8px; } .telao .t { font-size:16px; }
    .telao .st + .st { display:none; } .telao .info { max-width:52%; }
    .dica { font-size:10.5px; right:10px; }
  }
  @media (prefers-reduced-motion: reduce) { .letreiro span { animation:none; padding-left:10px; } .pessoa { transition:none !important; }
    .pessoa.andando .corpo, .pessoa.eu::before { animation:none; } }
</style>
</head>
<body>
<div class="salao" id="salao" tabindex="0" role="application"
     aria-label="Salão do pregão. Clique no chão ou use as setas do teclado para andar. Clique em alguém para conversar.">
  <div class="letreiro" id="letreiro"><span></span></div>
  <div class="chao" id="chao"></div>
  <div class="telao" id="telao" title="Abrir o gráfico do telão"></div>
  <div class="dica" id="dica"></div>
</div>
<script>
(() => {
  const salao = document.getElementById('salao'), chao = document.getElementById('chao');
  const telao = document.getElementById('telao'), letreiro = document.getElementById('letreiro');
  let args = null, eu = null, local = null, contador = 0, timerEnvio = null, altura = 520, decorado = false;
  const elems = {};

  const enviar = (tipo, dados) => window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: tipo }, dados), '*');
  const valor = v => enviar('streamlit:setComponentValue', { value: v, dataType: 'json' });
  const ajustarAltura = () => enviar('streamlit:setFrameHeight', { height: altura + 8 });
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const fmt = (v, casas = 2) => Number(v).toLocaleString('pt-BR', { minimumFractionDigits: casas, maximumFractionDigits: casas });

  function linha(serie, w, h, cheia) {
    if (!serie || serie.length < 2) return '';
    const min = Math.min(...serie), max = Math.max(...serie), amp = (max - min) || 1;
    const pts = serie.map((v, i) => [i / (serie.length - 1) * w, h - 4 - (v - min) / amp * (h - 8)]);
    const sobe = serie[serie.length - 1] >= serie[0], cor = sobe ? '#5FD39A' : '#F06A5D';
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const id = 'g' + Math.random().toString(36).slice(2, 7);
    const area = cheia ? `<defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${cor}" stop-opacity=".35"/>` +
      `<stop offset="1" stop-color="${cor}" stop-opacity="0"/></linearGradient></defs><path d="${d} L${w} ${h} L0 ${h} Z" fill="url(#${id})"/>` : '';
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">${area}<path d="${d}" fill="none" stroke="${cor}" stroke-width="${cheia ? 2.2 : 1.6}" vector-effect="non-scaling-stroke"/></svg>`;
  }

  function abrirGrafico(q, autor) {
    fecharMenu();
    const antigo = salao.querySelector('.janela'); if (antigo) antigo.remove();
    const var_ = q.var == null ? '' : `<span class="${q.var >= 0 ? 's' : 'd'}">${q.var >= 0 ? '▲' : '▼'} ${fmt(q.var * 100)}%</span>`;
    const j = document.createElement('div'); j.className = 'janela';
    j.innerHTML = `<div class="grafico" role="dialog" aria-label="Gráfico de ${esc(q.ticker)}">
      <div class="topo"><div><span class="tk">${esc(q.ticker)}</span> ${var_}
      <div class="meta">${esc(q.periodo_nome || '')}${autor ? ', compartilhado por ' + esc(autor) : ''}${q.ultimo != null ? ', último R$ ' + fmt(q.ultimo) : ''}</div></div>
      <button class="fechar" aria-label="Fechar">✕</button></div>
      ${linha(q.serie, 700, 240, true)}
      <div class="meta" style="display:flex;justify-content:space-between"><span>${esc((q.datas || [])[0] || '')}</span>
      <span>mín R$ ${q.serie ? fmt(Math.min(...q.serie)) : '-'}, máx R$ ${q.serie ? fmt(Math.max(...q.serie)) : '-'}</span><span>${esc((q.datas || [])[1] || '')}</span></div>
      ${q.nota ? `<div class="nota">“${esc(q.nota)}”</div>` : ''}
      <div class="aviso">Opinião de quem compartilhou, não é recomendação de investimento.</div></div>`;
    salao.appendChild(j);
    const f = () => { j.remove(); salao.focus(); };
    j.querySelector('.fechar').onclick = f;
    j.onclick = e => { if (e.target === j) f(); };
    j.querySelector('.fechar').focus();
  }

  let menuAberto = null;
  function fecharMenu() { if (menuAberto) { menuAberto.remove(); menuAberto = null; } }
  function abrirMenu(p, x, y) {
    fecharMenu();
    const m = document.createElement('div'); m.className = 'menu';
    const r = salao.getBoundingClientRect();
    m.style.left = Math.min(x, r.width - 210) + 'px'; m.style.top = Math.min(y, altura - 130) + 'px';
    let html = `<div class="cab">${esc(p.apelido)}${p.bio ? ': ' + esc(p.bio) : ''}</div>`;
    if (!p.demo) html += `<button data-a="privado">💬 Mensagem privada</button>`;
    if (p.quadro) html += `<button data-a="grafico">📈 Ver gráfico de ${esc(p.quadro.ticker)}</button>`;
    html += `<button data-a="perto">🚶 Ir até ${esc(p.apelido)}</button>`;
    m.innerHTML = html; salao.appendChild(m); menuAberto = m;
    m.querySelectorAll('button').forEach(b => b.onclick = ev => {
      ev.stopPropagation();
      const a = b.dataset.a; fecharMenu();
      if (a === 'privado') valor({ acao: 'privado', id: p.id, n: ++contador });
      if (a === 'grafico') abrirGrafico(p.quadro, p.apelido);
      if (a === 'perto') andarPara(Math.max(3, p.x - 7), p.y, true);
    });
    const primeiro = m.querySelector('button'); if (primeiro) primeiro.focus();
  }

  function posicionar(el, x, y, animar) {
    const ax = parseFloat(el.dataset.x || x), ay = parseFloat(el.dataset.y || y);
    const dist = Math.hypot(x - ax, (y - ay) * altura / Math.max(salao.clientWidth, 1));
    const dur = animar ? Math.min(3, Math.max(.25, dist * .045)) : 0;
    el.style.transition = `left ${dur}s linear, top ${dur}s linear`;
    if (x < ax - .2) el.classList.add('esquerda'); else if (x > ax + .2) el.classList.remove('esquerda');
    if (dur > 0 && dist > .2) {
      el.classList.add('andando');
      clearTimeout(el._parar); el._parar = setTimeout(() => el.classList.remove('andando'), dur * 1000);
    }
    el.style.left = x + '%'; el.style.top = y + '%';
    el.classList.toggle('borda-esq', x < 16); el.classList.toggle('borda-dir', x > 80);
    el.dataset.x = x; el.dataset.y = y;
  }

  function andarPara(x, y, enviarJa) {
    if (!eu) return;
    x = Math.max(3, Math.min(97, x)); y = Math.max(34, Math.min(94, y));
    local = { x, y };
    if (elems[eu]) posicionar(elems[eu], x, y, true);
    clearTimeout(timerEnvio);
    timerEnvio = setTimeout(() => valor({ acao: 'mover', x: +x.toFixed(1), y: +y.toFixed(1), n: ++contador }), enviarJa ? 50 : 450);
  }

  chao.addEventListener('click', e => {
    fecharMenu();
    const r = salao.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * 100, y = (e.clientY - r.top) / r.height * 100;
    const a = document.createElement('div'); a.className = 'alvo'; a.style.left = x + '%'; a.style.top = y + '%';
    salao.appendChild(a); setTimeout(() => a.remove(), 700);
    andarPara(x, y, true);
    salao.focus();
  });
  salao.addEventListener('keydown', e => {
    if (e.key === 'Escape') { fecharMenu(); const j = salao.querySelector('.janela'); if (j) j.remove(); return; }
    if (!local || salao.querySelector('.janela') || menuAberto) return;
    const passo = 3.2, mapa = { ArrowLeft: [-passo, 0], a: [-passo, 0], ArrowRight: [passo, 0], d: [passo, 0],
      ArrowUp: [0, -passo * 1.6], w: [0, -passo * 1.6], ArrowDown: [0, passo * 1.6], s: [0, passo * 1.6] };
    const m = mapa[e.key] || mapa[e.key.toLowerCase && e.key.toLowerCase()];
    if (!m) return;
    e.preventDefault();
    andarPara(local.x + m[0], local.y + m[1], false);
  });
  telao.addEventListener('click', e => { e.stopPropagation(); if (args && args.telao) abrirGrafico(args.telao, args.telao.apelido); });

  function decorar() {
    if (decorado) return; decorado = true;
    [[16, 56], [50, 62], [84, 56], [30, 84], [70, 84]].forEach(([x, y]) => {
      const m = document.createElement('div'); m.className = 'mesa'; m.style.left = x + '%'; m.style.top = y + '%'; chao.appendChild(m);
    });
    [[4, 44, '🪴'], [96, 44, '🪴'], [97, 95, '☕']].forEach(([x, y, c]) => {
      const p = document.createElement('div'); p.className = 'planta'; p.style.left = x + '%'; p.style.top = y + '%'; p.textContent = c; chao.appendChild(p);
    });
  }

  function desenhar() {
    altura = args.altura || (window.innerWidth < 560 ? 470 : 540);
    salao.classList.toggle('estreito', window.innerWidth < 560);
    salao.style.height = altura + 'px';
    ajustarAltura(); decorar();
    eu = args.eu;
    // letreiro
    const itens = (args.cotacoes || []).map(([a, p, v]) =>
      `<b>${esc(a)} ${esc(p)} <span class="${v >= 0 ? 's' : 'd'}">${v >= 0 ? '▲' : '▼'} ${fmt(Math.abs(v) * 100)}%</span></b>`).join('');
    const span = letreiro.querySelector('span');
    if (span.dataset.k !== itens) { span.innerHTML = itens || '<b>Mercado</b>'; span.dataset.k = itens; }
    // telão
    const t = args.telao;
    const corpo = `<div class="info"><div class="t">${esc(t ? t.ticker : args.titulo)}</div>` +
      `<div class="st">${t ? (t.var == null ? '' : `<span class="${t.var >= 0 ? 's' : 'd'}">${t.var >= 0 ? '▲' : '▼'} ${fmt(t.var * 100)}%</span> `) +
        esc(t.periodo_nome) + ', por ' + esc(t.apelido) : esc(args.subtitulo)}</div>` +
      `<div class="st">${esc(args.titulo)}, ${(args.pessoas || []).length} online</div></div>` + (t ? linha(t.serie, 300, 90, true) : '');
    if (telao.dataset.k !== corpo) { telao.innerHTML = corpo; telao.dataset.k = corpo; }
    // pessoas
    const vivos = new Set();
    (args.pessoas || []).forEach(p => {
      vivos.add(p.id);
      let el = elems[p.id];
      const nova = !el;
      if (nova) {
        el = document.createElement('div'); el.className = 'pessoa'; el.tabIndex = 0;
        el.innerHTML = '<div class="balao" hidden></div><div class="corpo"></div><div class="nome"></div>';
        el.addEventListener('click', ev => {
          ev.stopPropagation();
          const atual = (args.pessoas || []).find(q => q.id === el.dataset.id);
          if (!atual) return;
          if (atual.id === eu) { if (atual.quadro) abrirGrafico(atual.quadro, 'você'); return; }
          const r = salao.getBoundingClientRect(); abrirMenu(atual, ev.clientX - r.left, ev.clientY - r.top);
        });
        el.addEventListener('keydown', ev => { if (ev.key === 'Enter') el.click(); });
        salao.appendChild(el); elems[p.id] = el;
      }
      el.dataset.id = p.id;
      el.classList.toggle('eu', p.id === eu);
      el.setAttribute('aria-label', p.apelido + (p.fala ? ': ' + p.fala : ''));
      const imagem = p.foto ? `<img class="foto" src="${p.foto}" alt="">` : `<img class="sprite" src="${p.avatar}" width="48" height="64" alt="">`;
      const monitor = p.quadro ? `<div class="monitor" title="Gráfico de ${esc(p.quadro.ticker)}"><div class="mt"><span>${esc(p.quadro.ticker)}</span>` +
        `<span class="${(p.quadro.var || 0) >= 0 ? 's' : 'd'}">${p.quadro.var == null ? '' : fmt(p.quadro.var * 100, 1) + '%'}</span></div>${linha(p.quadro.serie, 80, 38, false)}</div>` : '';
      const chave = imagem + monitor;
      const corpoEl = el.querySelector('.corpo');
      if (corpoEl.dataset.k !== chave) { corpoEl.innerHTML = imagem + monitor; corpoEl.dataset.k = chave; }
      el.querySelector('.nome').textContent = p.apelido + (p.id === eu ? ' (você)' : '');
      const balao = el.querySelector('.balao');
      if (p.fala) { balao.textContent = p.fala; balao.hidden = false; } else balao.hidden = true;
      balao.classList.toggle('velho', p.id !== eu && (p.rank == null || p.rank >= 2));
      if (p.id === eu) {
        if (!local) local = { x: p.x, y: p.y };
        posicionar(el, local.x, local.y, !nova);
      } else {
        posicionar(el, p.x, p.y, !nova);
      }
      el.style.zIndex = 10 + Math.round((p.id === eu ? local.y : p.y));
    });
    Object.keys(elems).forEach(id => { if (!vivos.has(id)) { elems[id].remove(); delete elems[id]; } });
    document.getElementById('dica').textContent = args.dica || '';
  }

  window.addEventListener('message', e => {
    if (!e.data || e.data.type !== 'streamlit:render') return;
    args = e.data.args || {};
    desenhar();
  });
  window.addEventListener('resize', () => args && ajustarAltura());
  enviar('streamlit:componentReady', { apiVersion: 1 });
})();
</script>
</body>
</html>
